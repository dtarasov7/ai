<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">Схема без WebSocket</title><desc id="desc">Браузер — WAF — Ingress — Pod. HTTP запрос направлен вправо, HTTP ответ — влево.</desc>
<defs><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#059669"/></marker></defs>
<rect width="1600" height="520" fill="#ffffff"/><text x="800" y="63" font-family="Arial, sans-serif" text-anchor="middle" font-size="35" font-weight="700" fill="#0f172a">Без WebSocket — HTTP/HTTPS</text>
<g font-family="Arial,sans-serif" text-anchor="middle"><rect x="60" y="170" width="280" height="190" rx="22" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/><text x="200" y="232" font-size="52">🌐</text><text x="200" y="285" font-size="29" font-weight="700" fill="#0f172a">Браузер</text><text x="200" y="321" font-size="21" fill="#475569">клиент, код JS</text>
<rect x="460" y="170" width="280" height="190" rx="22" fill="#fff7ed" stroke="#f97316" stroke-width="3"/><text x="600" y="237" font-size="52">🛡</text><text x="600" y="297" font-size="30" font-weight="700" fill="#0f172a">WAF</text>
<rect x="860" y="170" width="280" height="190" rx="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/><text x="1000" y="237" font-size="52">⇄</text><text x="1000" y="297" font-size="30" font-weight="700" fill="#0f172a">Ingress</text>
<rect x="1260" y="170" width="280" height="190" rx="22" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="3"/><text x="1400" y="235" font-size="52">▣</text><text x="1400" y="287" font-size="30" font-weight="700" fill="#0f172a">Pod</text><text x="1400" y="323" font-size="21" fill="#475569">backend</text></g>
<g fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#blue)"><path d="M342 238 H450"/><path d="M742 238 H850"/><path d="M1142 238 H1250"/></g><g fill="none" stroke="#059669" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#green)"><path d="M1258 328 H1150"/><path d="M858 328 H750"/><path d="M458 328 H350"/></g>
<text x="800" y="133" font-family="Arial,sans-serif" font-size="26" fill="#2563eb" text-anchor="middle" font-weight="700">HTTP/HTTPS запрос →</text><text x="800" y="415" font-family="Arial,sans-serif" font-size="25" fill="#059669" text-anchor="middle" font-weight="700">← HTTP/HTTPS ответ</text><text x="800" y="465" font-family="Arial,sans-serif" font-size="20" fill="#475569" text-anchor="middle">Каждый запрос имеет отдельный цикл запрос–ответ (TCP-соединение может переиспользоваться)</text>
</svg>
