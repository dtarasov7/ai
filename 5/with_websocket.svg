<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">Схема с WebSocket</title><desc id="desc">Браузер — WAF — Ingress — Pod. После HTTP Upgrade передаются WebSocket сообщения в обе стороны по длительно живущему каналу.</desc>
<defs><marker id="two" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs>
<rect width="1600" height="520" fill="#ffffff"/><text x="800" y="63" font-family="Arial,sans-serif" text-anchor="middle" font-size="35" font-weight="700" fill="#0f172a">С WebSocket — постоянный двусторонний канал</text>
<rect x="420" y="86" width="760" height="57" rx="14" fill="#fef3c7" stroke="#fbbf24"/><text x="800" y="121" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#78350f">Handshake: HTTP/1.1 Upgrade → 101 Switching Protocols</text>
<g font-family="Arial,sans-serif" text-anchor="middle"><rect x="60" y="170" width="280" height="190" rx="22" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/><text x="200" y="232" font-size="52">🌐</text><text x="200" y="285" font-size="29" font-weight="700" fill="#0f172a">Браузер</text><text x="200" y="321" font-size="21" fill="#475569">клиент, код JS</text>
<rect x="460" y="170" width="280" height="190" rx="22" fill="#fff7ed" stroke="#f97316" stroke-width="3"/><text x="600" y="237" font-size="52">🛡</text><text x="600" y="297" font-size="30" font-weight="700" fill="#0f172a">WAF</text>
<rect x="860" y="170" width="280" height="190" rx="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/><text x="1000" y="237" font-size="52">⇄</text><text x="1000" y="297" font-size="30" font-weight="700" fill="#0f172a">Ingress</text>
<rect x="1260" y="170" width="280" height="190" rx="22" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="3"/><text x="1400" y="235" font-size="52">▣</text><text x="1400" y="287" font-size="30" font-weight="700" fill="#0f172a">Pod</text><text x="1400" y="323" font-size="21" fill="#475569">backend</text></g>
<g fill="none" stroke="#2563eb" stroke-width="6" marker-start="url(#two)" marker-end="url(#two)"><path d="M350 265 H450"/><path d="M750 265 H850"/><path d="M1150 265 H1250"/></g>
<path d="M200 372 V391 Q200 405 220 405 H1380 Q1400 405 1400 391 V372" fill="none" stroke="#059669" stroke-width="4"/>
<rect x="555" y="385" width="490" height="43" rx="18" fill="#dcfce7" stroke="#16a34a"/><text x="800" y="412" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#166534" font-weight="700">WebSocket: сообщения в обе стороны ↔</text><text x="800" y="472" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#475569">Соединение остаётся открытым; WAF и Ingress могут иметь отдельные TCP-соединения</text>
</svg>
