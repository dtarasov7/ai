<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="white" /><rect x="40.0" y="25.0" width="1520.0" height="55.00000000000001" rx="8" fill="#FFFFFF" stroke="none" /><text font-family="Arial, Liberation Sans" font-size="34.72222222222222" text-anchor="middle" dominant-baseline="central" x="800.0" y="52.5" fill="#10263D">Резервное копирование MinIO через файловый сервер</text><rect x="40.0" y="85.0" width="1520.0" height="55.00000000000001" rx="8" fill="#FFFFFF" stroke="none" /><text font-family="Arial, Liberation Sans" font-size="16.666666666666668" text-anchor="middle" dominant-baseline="central" x="800.0" y="112.5" fill="#526579">S3 → файловое зеркало → СРК  •  Регулярный цикл по расписанию</text><rect x="480.0" y="165.0" width="620.0" height="450.0" rx="8" fill="#F3F6FA" stroke="#A8BBCD" /><rect x="500" y="180.0" width="580.0" height="50.0" rx="8" fill="#F3F6FA" stroke="none" /><text font-family="Arial, Liberation Sans" font-size="22.22222222222222" text-anchor="middle" dominant-baseline="central" x="790.0" y="204.99999999999997" fill="#10263D">ПРОМЕЖУТОЧНЫЙ СЕРВЕР</text><rect x="50.0" y="260.0" width="340.0" height="265.0" rx="8" fill="#EAF2FA" stroke="#A8BBCD" /><text font-family="Arial, Liberation Sans" font-size="19.444444444444443" text-anchor="middle" dominant-baseline="central" x="220.00000000000003" y="331.73611111111114" fill="#10263D">КЛАСТЕР MinIO</text><text font-family="Arial, Liberation Sans" font-size="19.444444444444443" text-anchor="middle" dominant-baseline="central" x="220.00000000000003" y="380.34722222222223" fill="#10263D">bucket-a / bucket-b / …</text><text font-family="Arial, Liberation Sans" font-size="19.444444444444443" text-anchor="middle" dominant-baseline="central" x="220.00000000000003" y="404.65277777777777" fill="#10263D">≈ 100 000 объектов / бакет</text><text font-family="Arial, Liberation Sans" font-size="19.444444444444443" text-anchor="middle" dominant-baseline="central" x="220.00000000000003" y="428.95833333333326" fill="#10263D">≈ 500 ГБ / бакет</text><text font-family="Arial, Liberation Sans" font-size="19.444444444444443" text-anchor="middle" dominant-baseline="central" x="220.00000000000003" y="453.2638888888889" fill="#10263D">Изменения &lt; 1% в день</text><rect x="500" y="265.0" width="235.0" height="260.0" rx="8" fill="#DAEEF5" stroke="#A8BBCD" /><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="617.5" y="349.8611111111111" fill="#10263D">1. rclone sync</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="617.5" y="395.0" fill="#10263D">Читает S3</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="617.5" y="417.5694444444444" fill="#10263D">Сравнивает объекты</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="617.5" y="440.13888888888886" fill="#10263D">Обновляет зеркало</text><rect x="800" y="265.0" width="275.0" height="260.0" rx="8" fill="#E4F0E8" stroke="#A8BBCD" /><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="937.5" y="349.8611111111111" fill="#10263D">Файловая система</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="937.5" y="395.0" fill="#10263D">/backup/bucket-a/</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="937.5" y="417.5694444444444" fill="#10263D">/backup/bucket-b/</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="937.5" y="440.13888888888886" fill="#10263D">…</text><rect x="1200" y="260.0" width="350.0" height="265.0" rx="8" fill="#EEE8F6" stroke="#A8BBCD" /><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="1375.0" y="336.0763888888889" fill="#10263D">2. СРК</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="1375.0" y="381.21527777777777" fill="#10263D">Читает файловую систему</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="1375.0" y="403.78472222222223" fill="#10263D">Хранит резервные копии</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="1375.0" y="426.3541666666667" fill="#10263D">и точки восстановления</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="1375.0" y="448.92361111111114" fill="#10263D">согласно своей политике</text><polygon points="395.0,394.5 474.0,394.5 474.0,402.50000000000006 490.00000000000006,390.00000000000006 474.0,377.50000000000006 474.0,385.50000000000006 395.0,385.50000000000006 395.0,394.5" fill="#267C9C" /><polygon points="740.0,394.5 779.0,394.5 779.0,402.50000000000006 795.0,390.00000000000006 779.0,377.50000000000006 779.0,385.50000000000006 740.0,385.50000000000006 740.0,394.5" fill="#267C9C" /><polygon points="1080.0,394.5 1179.0,394.5 1179.0,402.50000000000006 1195.0,390.00000000000006 1179.0,377.50000000000006 1179.0,385.50000000000006 1080.0,385.50000000000006 1080.0,394.5" fill="#267C9C" /><rect x="50.0" y="545.0" width="340.0" height="65.0" rx="8" fill="#FFFFFF" stroke="none" /><text font-family="Arial, Liberation Sans" font-size="15.277777777777779" text-anchor="middle" dominant-baseline="central" x="220.00000000000003" y="577.5" fill="#10263D">Добавление • изменение • удаление</text><rect x="500" y="545.0" width="575.0" height="50.0" rx="8" fill="#F3F6FA" stroke="none" /><text font-family="Arial, Liberation Sans" font-size="16.666666666666668" text-anchor="middle" dominant-baseline="central" x="787.5" y="570.0" fill="#10263D">Зеркало текущего состояния, без истории</text><rect x="1200" y="545.0" width="350.0" height="65.0" rx="8" fill="#FFFFFF" stroke="none" /><text font-family="Arial, Liberation Sans" font-size="15.277777777777779" text-anchor="middle" dominant-baseline="central" x="1375.0" y="577.5" fill="#10263D">Доступ к S3 со стороны СРК не нужен</text><rect x="50.0" y="655.0" width="730.0" height="165.0" rx="8" fill="#E4F0E8" stroke="#A8BBCD" /><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="415.00000000000006" y="703.6458333333333" fill="#10263D">ПОСЛЕДОВАТЕЛЬНОСТЬ</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="415.00000000000006" y="726.2152777777777" fill="#10263D">Успешный sync всех выбранных бакетов → запуск СРК.</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="415.00000000000006" y="748.7847222222222" fill="#10263D">На время чтения СРК зеркало фиксируется:</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="415.00000000000006" y="771.3541666666666" fill="#10263D">пауза следующего sync либо снимок файловой системы.</text><rect x="810.0" y="655.0" width="740.0" height="165.0" rx="8" fill="#FFF2D9" stroke="#A8BBCD" /><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="1180.0" y="703.6458333333333" fill="#10263D">ОСОБЕННОСТИ</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="1180.0" y="726.2152777777777" fill="#10263D">Первый проход — все данные; затем — изменения.</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="1180.0" y="748.7847222222222" fill="#10263D">Удаления из S3 отражаются в файловом зеркале.</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="1180.0" y="771.3541666666666" fill="#10263D">Живой S3 без координации не даёт единого момента среза.</text></svg>