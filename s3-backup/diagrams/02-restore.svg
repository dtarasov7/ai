<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="white" /><rect x="40.0" y="25.0" width="1520.0" height="55.00000000000001" rx="8" fill="#FFFFFF" stroke="none" /><text font-family="Arial, Liberation Sans" font-size="34.72222222222222" text-anchor="middle" dominant-baseline="central" x="800.0" y="52.5" fill="#10263D">Восстановление MinIO через отдельный каталог</text><rect x="40.0" y="85.0" width="1520.0" height="55.00000000000001" rx="8" fill="#FFFFFF" stroke="none" /><text font-family="Arial, Liberation Sans" font-size="16.666666666666668" text-anchor="middle" dominant-baseline="central" x="800.0" y="112.5" fill="#526579">СРК → каталог восстановления → S3  •  Выбор точки восстановления и объёма данных</text><rect x="50.0" y="160.0" width="480.0" height="105.0" rx="8" fill="#EAF2FA" stroke="#A8BBCD" /><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="290.0" y="201.2152777777778" fill="#10263D">ВСЕ ДАННЫЕ</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="290.0" y="223.78472222222223" fill="#10263D">Каталоги всех выбранных бакетов</text><rect x="560.0" y="160.0" width="480.0" height="105.0" rx="8" fill="#EAF2FA" stroke="#A8BBCD" /><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="800.0" y="201.2152777777778" fill="#10263D">ОДИН БАКЕТ</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="800.0" y="223.78472222222223" fill="#10263D">Например, bucket-a целиком</text><rect x="1070.0" y="160.0" width="480.0" height="105.0" rx="8" fill="#EAF2FA" stroke="#A8BBCD" /><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="1310.0" y="201.2152777777778" fill="#10263D">ЧАСТЬ БАКЕТА</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="1310.0" y="223.78472222222223" fill="#10263D">Префикс / каталог или выбранные объекты</text><rect x="480.0" y="300" width="620.0" height="340.0" rx="8" fill="#F3F6FA" stroke="#A8BBCD" /><rect x="500" y="310.0" width="580.0" height="50.0" rx="8" fill="#F3F6FA" stroke="none" /><text font-family="Arial, Liberation Sans" font-size="22.22222222222222" text-anchor="middle" dominant-baseline="central" x="790.0" y="335.0" fill="#10263D">ПРОМЕЖУТОЧНЫЙ СЕРВЕР</text><rect x="50.0" y="385.0" width="340.0" height="220.00000000000003" rx="8" fill="#EEE8F6" stroke="#A8BBCD" /><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="220.00000000000003" y="449.8611111111112" fill="#10263D">1. СРК</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="220.00000000000003" y="495.0000000000001" fill="#10263D">Выбор резервной копии</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="220.00000000000003" y="517.5694444444445" fill="#10263D">и нужных данных</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="220.00000000000003" y="540.1388888888889" fill="#10263D">Восстановление файлов</text><rect x="500" y="385.0" width="280.0" height="220.00000000000003" rx="8" fill="#E4F0E8" stroke="#A8BBCD" /><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="640.0" y="449.8611111111112" fill="#10263D">Отдельный каталог</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="640.0" y="495.0000000000001" fill="#10263D">/restore/&lt;job&gt;/</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="640.0" y="517.5694444444445" fill="#10263D">bucket-a/...</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="640.0" y="540.1388888888889" fill="#10263D">bucket-b/...</text><rect x="825.0" y="385.0" width="250.0" height="220.00000000000003" rx="8" fill="#DAEEF5" stroke="#A8BBCD" /><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="950.0" y="449.8611111111112" fill="#10263D">2. rclone copy</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="950.0" y="495.0000000000001" fill="#10263D">Каталог бакета</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="950.0" y="517.5694444444445" fill="#10263D">→ целевой бакет</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="950.0" y="540.1388888888889" fill="#10263D">или его префикс</text><rect x="1200" y="385.0" width="350.0" height="220.00000000000003" rx="8" fill="#EAF2FA" stroke="#A8BBCD" /><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="1375.0" y="449.8611111111112" fill="#10263D">КЛАСТЕР MinIO</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="1375.0" y="495.0000000000001" fill="#10263D">Целевые бакеты</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="1375.0" y="517.5694444444445" fill="#10263D">и префиксы</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="1375.0" y="540.1388888888889" fill="#10263D">3. Проверка результата</text><polygon points="395.0,499.5 474.0,499.5 474.0,507.5 490.00000000000006,495.0 474.0,482.5 474.0,490.5 395.0,490.5 395.0,499.5" fill="#267C9C" /><polygon points="785.0,499.5 803.9999999999999,499.5 803.9999999999999,507.5 819.9999999999999,495.0 803.9999999999999,482.5 803.9999999999999,490.5 785.0,490.5 785.0,499.5" fill="#267C9C" /><polygon points="1080.0,499.5 1179.0,499.5 1179.0,507.5 1195.0,495.0 1179.0,482.5 1179.0,490.5 1080.0,490.5 1080.0,499.5" fill="#267C9C" /><rect x="50.0" y="680.0" width="730.0" height="160.0" rx="8" fill="#E4F0E8" stroke="#A8BBCD" /><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="415.00000000000006" y="726.1458333333334" fill="#10263D">ПРАВИЛА ВОССТАНОВЛЕНИЯ</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="415.00000000000006" y="748.7152777777778" fill="#10263D">copy добавляет и обновляет выбранные объекты;</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="415.00000000000006" y="771.2847222222223" fill="#10263D">посторонние объекты в S3 не удаляет.</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="415.00000000000006" y="793.8541666666666" fill="#10263D">Точный откат состава — в пустой целевой бакет.</text><rect x="810.0" y="680.0" width="740.0" height="160.0" rx="8" fill="#FFF2D9" stroke="#A8BBCD" /><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="1180.0" y="726.1458333333334" fill="#10263D">ИЗОЛЯЦИЯ И ПРОВЕРКА</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="1180.0" y="748.7152777777778" fill="#10263D">/restore/ отделён от рабочего зеркала /backup/.</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="1180.0" y="771.2847222222223" fill="#10263D">Для записи в рабочий бакет согласовать паузу изменений.</text><text font-family="Arial, Liberation Sans" font-size="18.055555555555557" text-anchor="middle" dominant-baseline="central" x="1180.0" y="793.8541666666666" fill="#10263D">Проверить состав и содержимое восстановленных объектов.</text></svg>