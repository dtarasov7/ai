<text x="950" y="473" font-family="Open Sans, sans-serif" font-size="22" fill="#dd4545" font-weight="700" text-anchor="middle">ЗАПИСЬ · каждый vminsert → все 3 vmstorage · внутренний протокол / TCP 8400</text>
<rect x="220" y="790" width="1460" height="45" rx="13" fill="url(#g159447)" stroke="#159447" stroke-width="2"/>
<text x="950" y="820" font-family="Open Sans, sans-serif" font-size="22" fill="#159447" font-weight="700" text-anchor="middle">ЧТЕНИЕ · каждый vmselect → все 3 vmstorage · внутренний протокол / TCP 8401</text>
<rect x="55" y="1100" width="825" height="194" rx="13" fill="url(#g72849c)" stroke="#72849c" stroke-width="2"/>
<text x="77" y="1136" font-family="Open Sans, sans-serif" font-size="24" fill="#0b1938" font-weight="700" text-anchor="start">Что означают стрелки</text>
<text x="77" y="1173" font-family="Open Sans, sans-serif" font-size="20" fill="#0b1938" font-weight="400" text-anchor="start">Красный: запись; зелёный: инициатор запроса чтения.</text>
<text x="77" y="1204" font-family="Open Sans, sans-serif" font-size="20" fill="#0b1938" font-weight="400" text-anchor="start">9 соединений записи + 9 соединений чтения.</text>
<text x="77" y="1235" font-family="Open Sans, sans-serif" font-size="20" fill="#0b1938" font-weight="400" text-anchor="start">Данные чтения возвращаются по тем же соединениям.</text>
<text x="77" y="1266" font-family="Open Sans, sans-serif" font-size="20" fill="#0b1938" font-weight="400" text-anchor="start">vmstorage не обмениваются репликами между собой.</text>
<rect x="920" y="1100" width="825" height="194" rx="13" fill="url(#gdd4545)" stroke="#dd4545" stroke-width="2"/>
<text x="942" y="1136" font-family="Open Sans, sans-serif" font-size="24" fill="#dd4545" font-weight="700" text-anchor="start">HA: один vmstorage недоступен</text>
<text x="942" y="1173" font-family="Open Sans, sans-serif" font-size="20" fill="#0b1938" font-weight="400" text-anchor="start">Новые записи перенаправляются на оставшиеся узлы.</text>
<text x="942" y="1204" font-family="Open Sans, sans-serif" font-size="20" fill="#0b1938" font-weight="400" text-anchor="start">RF=1: часть истории недоступна; partial / ошибка.</text>
<text x="942" y="1235" font-family="Open Sans, sans-serif" font-size="20" fill="#0b1938" font-weight="400" text-anchor="start">RF=2: ранее реплицированные данные доступны.</text>
<text x="942" y="1266" font-family="Open Sans, sans-serif" font-size="20" fill="#0b1938" font-weight="400" text-anchor="start">RF=2 на insert/select + dedup; детали — в 1.md.</text>
<text x="900" y="1035" font-family="Open Sans, sans-serif" font-size="21" fill="#72849c" font-weight="400" text-anchor="middle">При отказе одного vminsert или vmselect остальные экземпляры продолжают работу.</text>
<text x="55" y="1376" font-family="Open Sans, sans-serif" font-size="15" fill="#72849c" font-weight="400" text-anchor="start">VICTORIAMETRICS 1.130.0  /  3 УЗЛА  /  ПРОЕКТНАЯ СХЕМА</text>
<text x="1745" y="1376" font-family="Open Sans, sans-serif" font-size="17" fill="#72849c" font-weight="400" text-anchor="end">01 / 05</text>
