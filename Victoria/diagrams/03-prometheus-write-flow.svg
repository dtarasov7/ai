<text x="950" y="615" font-family="Open Sans, sans-serif" font-size="22" fill="#dd4545" font-weight="700" text-anchor="middle">L7: каждый vmauth выбирает один из трёх vminsert · HTTP :8480</text>
<rect x="220" y="853" width="1460" height="45" rx="13" fill="url(#gdd4545)" stroke="#dd4545" stroke-width="2"/>
<text x="950" y="883" font-family="Open Sans, sans-serif" font-size="22" fill="#dd4545" font-weight="700" text-anchor="middle">Каждый vminsert → все 3 vmstorage · TCP 8400 · шарды / RF</text>
<rect x="55" y="1110" width="825" height="194" rx="13" fill="url(#g72849c)" stroke="#72849c" stroke-width="2"/>
<text x="77" y="1146" font-family="Open Sans, sans-serif" font-size="24" fill="#0b1938" font-weight="700" text-anchor="start">Путь запроса и обозначения</text>
<text x="77" y="1183" font-family="Open Sans, sans-serif" font-size="20" fill="#0b1938" font-weight="400" text-anchor="start">Клиент: /api/v1/write → vmauth добавляет tenant 0</text>
<text x="77" y="1214" font-family="Open Sans, sans-serif" font-size="20" fill="#0b1938" font-weight="400" text-anchor="start">Синий: вход и пунктирный DR-ответ от real server.</text>
<text x="77" y="1245" font-family="Open Sans, sans-serif" font-size="20" fill="#0b1938" font-weight="400" text-anchor="start">Красный: пунктир — выбор HTTP-backend; сплошной — TCP.</text>
<text x="77" y="1276" font-family="Open Sans, sans-serif" font-size="20" fill="#0b1938" font-weight="400" text-anchor="start">Backend: /diag/&lt;компонент&gt;/&lt;узел&gt;/ + tenant-путь.</text>
<rect x="920" y="1110" width="825" height="194" rx="13" fill="url(#gdd4545)" stroke="#dd4545" stroke-width="2"/>
<text x="942" y="1146" font-family="Open Sans, sans-serif" font-size="24" fill="#dd4545" font-weight="700" text-anchor="start">HA: отказ → резервный путь</text>
<text x="942" y="1183" font-family="Open Sans, sans-serif" font-size="20" fill="#0b1938" font-weight="400" text-anchor="start">vmauth / vminsert: выбирается доступный экземпляр.</text>
<text x="942" y="1214" font-family="Open Sans, sans-serif" font-size="20" fill="#0b1938" font-weight="400" text-anchor="start">MASTER: VIP переходит на другой узел; нужны повторы.</text>
<text x="942" y="1245" font-family="Open Sans, sans-serif" font-size="20" fill="#0b1938" font-weight="400" text-anchor="start">vmstorage: новые записи идут на доступные узлы.</text>
<text x="942" y="1276" font-family="Open Sans, sans-serif" font-size="20" fill="#0b1938" font-weight="400" text-anchor="start">RF=2: две копии; RF=1: часть истории недоступна.</text>
<text x="55" y="1376" font-family="Open Sans, sans-serif" font-size="15" fill="#72849c" font-weight="400" text-anchor="start">VICTORIAMETRICS 1.130.0  /  3 УЗЛА  /  ПРОЕКТНАЯ СХЕМА</text>
<text x="1745" y="1376" font-family="Open Sans, sans-serif" font-size="17" fill="#72849c" font-weight="400" text-anchor="end">03 / 05</text>
