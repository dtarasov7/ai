<text x="1322" y="218" font-family="Open Sans, sans-serif" font-size="19" fill="#0b1938" font-weight="400" text-anchor="start">IPVS выбирает один vmauth</text>
<text x="1322" y="249" font-family="Open Sans, sans-serif" font-size="19" fill="#0b1938" font-weight="400" text-anchor="start">на новое TCP-соединение.</text>
<text x="1322" y="280" font-family="Open Sans, sans-serif" font-size="19" fill="#0b1938" font-weight="400" text-anchor="start">Health checks исключают backend.</text>
