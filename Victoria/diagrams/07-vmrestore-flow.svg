<text x="900" y="65" font-family="Open Sans, sans-serif" font-size="43" fill="#0b1938" font-weight="700" text-anchor="middle">Схема 7. vmrestore — восстановление данных</text>
<text x="900" y="106" font-family="Open Sans, sans-serif" font-size="21" fill="#72849c" font-weight="400" text-anchor="middle">Копия каждого vmstorage → его целевой том · vmstorage остановлен до завершения</text>
