<rect x="220" y="430" width="1460" height="45" rx="13" fill="url(#g159447)" stroke="#159447" stroke-width="2"/>
<text x="950" y="460" font-family="Open Sans, sans-serif" font-size="20" fill="#159447" font-weight="700" text-anchor="middle">1. Получение копий · vmrestore инициирует HTTPS / TCP 443* · стрелки показывают поток данных</text>
<rect x="55" y="1270" width="825" height="256" rx="13" fill="url(#g72849c)" stroke="#72849c" stroke-width="2"/>
<text x="77" y="1306" font-family="Open Sans, sans-serif" font-size="24" fill="#0b1938" font-weight="700" text-anchor="start">Условия восстановления</text>
<text x="77" y="1343" font-family="Open Sans, sans-serif" font-size="19" fill="#0b1938" font-weight="400" text-anchor="start">Выбирается завершённая копия нужного vmstorage.</text>
<text x="77" y="1374" font-family="Open Sans, sans-serif" font-size="19" fill="#0b1938" font-weight="400" text-anchor="start">Зелёный: копия → утилита; красный: запись на диск.</text>
<text x="77" y="1405" font-family="Open Sans, sans-serif" font-size="19" fill="#0b1938" font-weight="400" text-anchor="start">Серый пунктир: запуск после восстановления.</text>
<text x="77" y="1436" font-family="Open Sans, sans-serif" font-size="19" fill="#0b1938" font-weight="400" text-anchor="start">Каталог доступен утилите; vmstorage его не использует.</text>
<text x="77" y="1467" font-family="Open Sans, sans-serif" font-size="19" fill="#0b1938" font-weight="400" text-anchor="start">* Порт endpoint зависит от выбранного хранилища.</text>
<text x="77" y="1498" font-family="Open Sans, sans-serif" font-size="19" fill="#0b1938" font-weight="400" text-anchor="start">Показаны три пути; один узел восстанавливается отдельно.</text>
<rect x="920" y="1270" width="825" height="256" rx="13" fill="url(#gdd4545)" stroke="#dd4545" stroke-width="2"/>
<text x="942" y="1306" font-family="Open Sans, sans-serif" font-size="24" fill="#dd4545" font-weight="700" text-anchor="start">Ограничения и HA</text>
<text x="942" y="1343" font-family="Open Sans, sans-serif" font-size="20" fill="#0b1938" font-weight="400" text-anchor="start">Существующие файлы могут заменяться и удаляться.</text>
<text x="942" y="1374" font-family="Open Sans, sans-serif" font-size="20" fill="#0b1938" font-weight="400" text-anchor="start">При восстановлении одного узла остальные работают.</text>
<text x="942" y="1405" font-family="Open Sans, sans-serif" font-size="20" fill="#0b1938" font-weight="400" text-anchor="start">Полнота чтения зависит от RF и наличия реплик.</text>
<text x="942" y="1436" font-family="Open Sans, sans-serif" font-size="20" fill="#0b1938" font-weight="400" text-anchor="start">Данных после snapshot в этой копии нет.</text>
<text x="942" y="1467" font-family="Open Sans, sans-serif" font-size="20" fill="#0b1938" font-weight="400" text-anchor="start">Автодогрузки истории между vmstorage нет.</text>
<text x="942" y="1498" font-family="Open Sans, sans-serif" font-size="20" fill="#0b1938" font-weight="400" text-anchor="start">Конфигурации и правила восстанавливаются отдельно.</text>
<text x="55" y="1576" font-family="Open Sans, sans-serif" font-size="15" fill="#72849c" font-weight="400" text-anchor="start">VICTORIAMETRICS 1.130.0  /  3 УЗЛА  /  ПРОЕКТНАЯ СХЕМА</text>
<text x="1745" y="1576" font-family="Open Sans, sans-serif" font-size="17" fill="#72849c" font-weight="400" text-anchor="end">07 / 07</text>
