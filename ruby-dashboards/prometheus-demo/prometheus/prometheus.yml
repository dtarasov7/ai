global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: yabeda-rails-demo
    metrics_path: /metrics
    static_configs:
      - targets:
          - app:3000
        labels:
          namespace: test
          service: rails
          pod: rails-demo-0

  - job_name: yabeda-sidekiq-demo
    metrics_path: /metrics
    static_configs:
      - targets:
          - sidekiq:9394
        labels:
          namespace: test
          service: sidekiq
          pod: sidekiq-demo-0
